services:
  app:
    build:
      context: ..
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      DB_PATH: /app/data/gatekeeper.sqlite
      ARTIFACTS_DIR: /app/circuits
    expose:
      - "3000"
    volumes:
      - gatekeeper-data:/app/data
    read_only: true
    tmpfs:
      - "/tmp:size=32m,mode=1777,noexec,nosuid"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      AGENT_DOMAIN: "${AGENT_DOMAIN:?Set AGENT_DOMAIN to your DNS hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  gatekeeper-data:
  caddy-data:
  caddy-config:
